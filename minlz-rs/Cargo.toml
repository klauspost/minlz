[package]
name = "minlz"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "MinLZ compression library - Rust implementation"
homepage = "https://github.com/minio/minlz-rs"
repository = "https://github.com/minio/minlz-rs"
readme = "README.md"
keywords = ["compression", "lz77", "minlz", "performance"]
categories = ["compression", "algorithms"]

[dependencies]
crc32fast = "1.3"
crc32c = "0.6"
once_cell = "1.19"
clap = { version = "4.0", features = ["derive"] }
snap = "1.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
hex = "0.4"
reqwest = { version = "0.11", features = ["blocking"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }

[[bench]]
name = "simple_benchmarks"
harness = false

[[bench]]
name = "comparison_benchmarks"
harness = false

[[bin]]
name = "mz"
path = "src/bin/mz.rs"

[profile.release]
debug-assertions = true
